server:
  host: "0.0.0.0"
  port: 5010
  debug: true

llm:
  default: bailian
  adapters:
    bailian:
      type: bailian
      model: qwen3.6-flash-2026-04-16
      api_key: ${DASHSCOPE_API_KEY}
  agent_bindings:
    TaskParser: bailian
    Analyst: bailian
    Writer: bailian
    Reviewer: bailian
    Collector: bailian

dag:
  max_feedback_rounds: 3
  node_timeout_seconds: 300
  max_retries: 3

anysearch:
  api_key: ""
  search_timeout: 15
  extract_timeout: 30
  max_results_per_query: 5
