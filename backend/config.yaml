server:
  host: "0.0.0.0"
  port: 7007
  debug: true

llm:
  default: bailian
  adapters:
    bailian:
      type: bailian
      model: qwen3.6-plus-2026-04-02
      api_key: ${DASHSCOPE_API_KEY}
  agent_bindings:
    TaskParser: bailian
    Analyst: bailian
    Writer: bailian
    Reviewer: bailian
    Collector: bailian

dag:
  max_feedback_rounds: 3
  node_timeout_seconds: 300
  max_retries: 3
