server:
  host: "0.0.0.0"
  port: 5010
  debug: true

llm:
  default: bailian
  adapters:
    bailian:
      type: bailian
      model: qwen3.7-max-2026-05-17
      api_key: ${DASHSCOPE_API_KEY}
  agent_bindings:
    TaskParser: bailian
    Analyst: bailian
    Writer: bailian
    Reviewer: bailian
    Collector: bailian

dag:
  max_feedback_rounds: 3
  node_timeout_seconds: 300
  max_retries: 3

anysearch:
  api_key: "as_sk_04c72d357372a6f05f10a67d2d7a8d93"
  search_timeout: 15
  extract_timeout: 30
  max_results_per_query: 5

# LLM 定价（CNY / 1k tokens，按 model 区分；未匹配 model 走 default）
llm_pricing:
  "qwen3.7-max-2026-05-17": {in: 0.0008, out: 0.002}
  "claude-opus-4-8":          {in: 0.015,  out: 0.075}
  "gpt-5.2":                  {in: 0.005,  out: 0.015}
  default:                     {in: 0.001,  out: 0.002}
